[package]
name = "telemetry-kernel"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Kaaladrishti telemetry kernel: TelemetrySource trait, synthetic source, and UDS transport"

[lib]
name = "telemetry_kernel"
path = "src/lib.rs"

[[bin]]
name = "telemetry-kernel"
path = "src/main.rs"

[dependencies]
# Protobuf serialization via prost (no unsafe, pure Rust)
# Justification: required for cross-language protobuf contract with Go and Python
prost = "0.12"
prost-types = "0.12"

# Async runtime — required for UDS I/O and source lifecycle management
# Justification: telemetry source must stream events concurrently with transport
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }

# bytes crate for efficient buffer management (tokio ecosystem)
bytes = "1"

# async-trait: enables async fn in trait definitions (required by TelemetrySource)
# Justification: Rust stable does not yet support async fn in traits natively
async-trait = "0.1"

# Structured logging — JSON output for Go ingestion log correlation
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# UUIDs for event_id generation (no_std compatible, no unsafe)
uuid = { version = "1", features = ["v4"] }

# Random number generation for synthetic data (no unsafe)
rand = "0.8"

# Error handling — anyhow for application-level errors
anyhow = "1"

# Serialization for config loading (TOML/env)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Environment variable config
dotenvy = "0.15"

# Network packet capture and parsing
pcap = "1.3"
pnet = "0.34"

[dev-dependencies]
# Test utilities
tokio-test = "0.4"
tempfile = "3"

[build-dependencies]
# protoc-based code generation for prost
# Justification: generates Rust types from the canonical platform.proto
prost-build = "0.12"

[features]
default = []
# Feature gate for future eBPF sensor — compiles to nothing in default builds.
# Justification: keeps unsafe eBPF code structurally isolated from this crate.
# Real implementation lives in a separate crate (not yet created).
ebpf = []
